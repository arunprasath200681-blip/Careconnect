# ===================================================================
# CareConnect - Spring Boot & MySQL Configuration
# ===================================================================
server.port=8080
spring.application.name=careconnect

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/careconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Arun@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / MySQL Database Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Web & Static Resources (HTML, CSS, JavaScript)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.careconnect=INFO
logging.level.org.springframework.web=INFO
