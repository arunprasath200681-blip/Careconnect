# ===================================================================
-- CareConnect - Spring Boot & MySQL Configuration (Spring JDBC)
# ===================================================================
server.port=8080
spring.application.name=careconnect

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/careconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Arun@2006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database Schema Initialization (Spring JDBC)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Web & Static Resources (HTML, CSS, JavaScript)
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.careconnect=INFO
logging.level.org.springframework.web=INFO
