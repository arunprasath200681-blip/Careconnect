# ===================================================================
# CareConnect - MySQL Configuration Profile
# Activate this profile by setting `spring.profiles.active=mysql` in application.properties
# or running: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/careconnect_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
